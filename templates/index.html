<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Calculadora de Teoría de Colas</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            type="text/css"
            href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css"
        />

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/gh/fancyapps/fancybox@3.5.7/dist/jquery.fancybox.min.css"
        />

        <style>
            :root {
                color-scheme: light;
                --ink: #172b4d;
                --muted: #64748b;
                --brand: #2563eb;
                --brand-dark: #1d4ed8;
                --line: #e2e8f0;
                --surface: #ffffff;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                padding: 56px 0;
                color: var(--ink);
                background:
                    radial-gradient(
                        circle at 8% 8%,
                        rgba(37, 99, 235, 0.1),
                        transparent 28rem
                    ),
                    linear-gradient(145deg, #f8fafc 0%, #eef4ff 100%);
                font-family:
                    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                    "Segoe UI", sans-serif;
            }

            .container {
                max-width: 960px;
            }

            .page-heading {
                margin: 0 auto 30px;
                text-align: center;
            }

            .page-eyebrow {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 14px;
                padding: 7px 12px;
                border: 1px solid #dbeafe;
                border-radius: 999px;
                color: var(--brand-dark);
                background: #eff6ff;
                font-size: 0.75rem;
                font-weight: 700;
                letter-spacing: 0.08em;
            }

            .page-heading h1 {
                margin-bottom: 10px;
                color: var(--ink);
                font-size: clamp(2rem, 5vw, 3rem);
                font-weight: 750;
                letter-spacing: -0.045em;
            }

            .page-heading p {
                max-width: 590px;
                margin: 0 auto;
                color: var(--muted);
                font-size: 1rem;
                line-height: 1.7;
            }

            .card {
                overflow: hidden;
                border: 1px solid rgba(203, 213, 225, 0.8);
                border-radius: 18px;
                background: var(--surface);
                box-shadow:
                    0 18px 45px rgba(30, 64, 175, 0.08),
                    0 3px 10px rgba(15, 23, 42, 0.04);
            }

            .card-header {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 20px 24px;
                border: 0;
                color: var(--ink);
                background: var(--surface);
            }

            .section-icon {
                display: grid;
                width: 42px;
                height: 42px;
                flex: 0 0 42px;
                place-items: center;
                border-radius: 13px;
                color: var(--brand);
                background: #eff6ff;
                font-size: 1.15rem;
            }

            .card-header h4 {
                font-size: 1.1rem;
                font-weight: 700;
                letter-spacing: -0.02em;
            }

            .card-body {
                padding: 8px 24px 26px;
            }

            .btn-primary {
                padding: 11px 20px;
                border-color: var(--brand);
                border-radius: 10px;
                background-color: var(--brand);
                box-shadow: 0 5px 12px rgba(37, 99, 235, 0.2);
                font-weight: 650;
                transition:
                    background-color 0.2s ease,
                    box-shadow 0.2s ease,
                    transform 0.2s ease;
            }

            .btn-primary:hover {
                transform: translateY(-1px);
                border-color: var(--brand-dark);
                background-color: var(--brand-dark);
                box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
            }

            .btn-primary:disabled {
                box-shadow: none;
            }

            .btn-outline-secondary {
                padding: 9px 13px;
                border-color: #cbd5e1;
                border-radius: 9px;
                color: #475569;
                font-weight: 600;
            }

            .form-label {
                margin-bottom: 8px;
                color: #334155;
                font-size: 0.92rem;
                font-weight: 600;
            }

            .form-control,
            .form-select {
                min-height: 46px;
                border-color: #d7e0ec;
                border-radius: 10px;
                color: var(--ink);
                background-color: #fff;
            }

            .form-control:focus,
            .form-select:focus {
                border-color: #7aa7fa;
                box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
            }

            #model {
                max-width: 100%;
            }

            .result-row {
                padding: 12px 0;
                border-bottom: 1px solid var(--line);
            }

            .result-value {
                color: var(--brand-dark);
                font-weight: 700;
            }

            .loader {
                width: 38px;
                height: 38px;
                margin: 22px auto;
                border: 4px solid #dbeafe;
                border-top-color: var(--brand);
                border-radius: 50%;
                display: none;
                animation: spin 0.8s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .model-desc {
                min-height: 24px;
                margin-top: 9px;
                color: var(--muted);
                font-size: 0.88rem;
            }

            .model-desc i:hover {
                color: var(--brand);
                opacity: 1 !important;
                transition: color 0.2s ease;
            }

            .modal-content {
                overflow: hidden;
                border: 0;
                border-radius: 16px;
                box-shadow: 0 24px 70px rgba(15, 23, 42, 0.2);
            }

            .modal-header {
                padding: 18px 22px;
                border-bottom: 1px solid var(--line);
            }

            .modal-body {
                padding: 22px;
                text-align: center;
            }

            .modal-body img {
                max-width: 100%;
                height: auto;
                display: block;
                margin: 0 auto;
                cursor: zoom-in;
            }

            .alert-danger {
                border: 1px solid #fecaca;
                border-radius: 12px;
            }

            @media (max-width: 575.98px) {
                body {
                    padding: 34px 0;
                }

                .page-heading {
                    margin-bottom: 22px;
                }

                .card-header {
                    padding: 17px 18px;
                }

                .card-body {
                    padding: 6px 18px 21px;
                }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <header class="page-heading">
                <div class="page-eyebrow">
                    <i class="bi bi-graph-up-arrow" aria-hidden="true"></i>
                    ANÁLISIS DE SISTEMAS DE ESPERA
                </div>
                <h1>Calculadora de Teoría de Colas</h1>
                <p>
                    Selecciona un modelo, ingresa sus parámetros y consulta los
                    indicadores de desempeño de tu sistema.
                </p>
            </header>

            <div class="card mb-4">
                <div class="card-header">
                    <span class="section-icon" aria-hidden="true">
                        <i class="bi bi-sliders"></i>
                    </span>
                    <h4 class="mb-0">Configura tu modelo</h4>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="model" class="form-label"
                                >Seleccione un modelo:</label
                            >
                            <select id="model" class="form-select">
                                <option value="">-- Seleccione --</option>
                                <option value="PICS">
                                    M/M/1 (PICS - Población Infinita Canal
                                    Simple)
                                </option>
                                <option value="PICM">
                                    M/M/k (PICM - Población Infinita Canal
                                    Múltiple)
                                </option>
                                <option value="PFCS">
                                    M/M/1/M/M (PFCS - Población Finita Canal
                                    Simple)
                                </option>
                                <option value="PFCM">
                                    M/M/k/M/M (PFCM - Población Finita Canal
                                    Múltiple)
                                </option>
                            </select>
                            <div
                                id="model-description"
                                class="model-desc"
                            ></div>
                        </div>
                    </div>

                    <form id="params-form">
                        <div id="required-params" class="row mt-3"></div>

                        <div class="mt-4">
                            <button
                                type="button"
                                id="btn-show-optional"
                                class="btn btn-outline-secondary btn-sm"
                            >
                                Mostrar parámetros opcionales
                            </button>
                            <div
                                id="optional-params"
                                class="row mt-3"
                                style="display: none"
                            ></div>
                        </div>

                        <div class="mt-4">
                            <button
                                type="submit"
                                id="btn-calculate"
                                class="btn btn-primary"
                                disabled
                            >
                                Calcular
                            </button>
                            <div class="loader" id="loader"></div>
                        </div>
                    </form>
                </div>
            </div>

            <div id="results-container" class="card mb-4" style="display: none">
                <div class="card-header">
                    <span class="section-icon" aria-hidden="true">
                        <i class="bi bi-bar-chart-line"></i>
                    </span>
                    <h4 class="mb-0">Resultados del análisis</h4>
                </div>
                <div class="card-body">
                    <div id="results"></div>
                </div>
            </div>

            <div
                id="error-container"
                class="alert alert-danger"
                style="display: none"
            >
                <div id="error-message"></div>
            </div>
        </div>

        <div
            class="modal fade"
            id="formulasModal"
            tabindex="-1"
            aria-labelledby="formulasModalLabel"
            aria-hidden="true"
        >
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="formulasModalLabel">
                            Fórmulas del Modelo
                        </h5>
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"
                        ></button>
                    </div>
                    <div class="modal-body">
                        <a
                            id="fancybox-link"
                            data-fancybox="formula-gallery"
                            data-caption="Fórmulas del modelo"
                        >
                            <img
                                id="formula-image"
                                src=""
                                alt="Fórmulas del modelo"
                                class="img-fluid"
                            />
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/fancyapps/fancybox@3.5.7/dist/jquery.fancybox.min.js"></script>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const modelSelect = document.getElementById("model");
                const paramsForm = document.getElementById("params-form");
                const requiredParamsDiv =
                    document.getElementById("required-params");
                const optionalParamsDiv =
                    document.getElementById("optional-params");
                const btnShowOptional =
                    document.getElementById("btn-show-optional");
                const btnCalculate = document.getElementById("btn-calculate");
                const resultsContainer =
                    document.getElementById("results-container");
                const resultsDiv = document.getElementById("results");
                const errorContainer =
                    document.getElementById("error-container");
                const errorMessageDiv =
                    document.getElementById("error-message");
                const loader = document.getElementById("loader");
                const modelDescription =
                    document.getElementById("model-description");
                const formulaImage = document.getElementById("formula-image");
                const fancyboxLink = document.getElementById("fancybox-link"); // Nuevo elemento
                const formulasModal = new bootstrap.Modal(
                    document.getElementById("formulasModal")
                );

                // Mapeo de descripciones de modelos
                const modelDescriptions = {
                    PICS: "Sistema con población infinita y un solo servidor (M/M/1)",
                    PICM: "Sistema con población infinita y múltiples servidores (M/M/k)",
                    PFCS: "Sistema con población finita y un solo servidor (M/M/1/M/M)",
                    PFCM: "Sistema con población finita y múltiples servidores (M/M/k/M/M)",
                };

                // Mapeo de rutas de imágenes de fórmulas
                const formulaImages = {
                    PICS: "/static/Formulas/M-M-1.png",
                    PICM: "/static/Formulas/M-M-K.png",
                    PFCS: "/static/Formulas/M-M-1-M-M.png",
                    PFCM: "/static/Formulas/M-M-K-M-M.png",
                };

                // Función para mostrar el botón de fórmulas
                function showFormulasButton(model) {
                    modelDescription.innerHTML = ""; // Limpiar descripción anterior
                    if (model && formulaImages[model]) {
                        // Crear span para la descripción
                        const descSpan = document.createElement("span");
                        descSpan.textContent = modelDescriptions[model];

                        // Crear el ícono discreto para las fórmulas
                        const icon = document.createElement("i");
                        icon.className = "bi bi-info-circle-fill";
                        icon.style.cssText =
                            "font-size: 0.8em; margin-left: 5px; opacity: 0.5; cursor: pointer;";
                        icon.title = "Ver fórmulas";

                        // Agregar evento click al ícono
                        icon.addEventListener("click", () => {
                            const imageUrl = formulaImages[model];
                            formulaImage.src = imageUrl;
                            fancyboxLink.href = imageUrl;
                            formulasModal.show();
                        });

                        // Agregar elementos al contenedor de descripción
                        modelDescription.appendChild(descSpan);
                        modelDescription.appendChild(icon);
                    }
                }

                // Evento al cambiar el modelo
                modelSelect.addEventListener("change", function () {
                    const selectedModel = this.value;

                    // Mostrar descripción del modelo
                    if (selectedModel) {
                        modelDescription.textContent =
                            modelDescriptions[selectedModel];
                        showFormulasButton(selectedModel); // Mostrar botón de fórmulas
                    } else {
                        modelDescription.textContent = "";
                    }

                    // Limpiar formularios anteriores
                    requiredParamsDiv.innerHTML = "";
                    optionalParamsDiv.innerHTML = "";

                    // Ocultar resultados y errores
                    resultsContainer.style.display = "none";
                    errorContainer.style.display = "none";

                    if (selectedModel) {
                        // Activar botón de cálculo
                        btnCalculate.disabled = false;

                        // Obtener parámetros para el modelo seleccionado
                        fetch("/get_params", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify({ model: selectedModel }),
                        })
                            .then((response) => response.json())
                            .then((data) => {
                                if (data.error) {
                                    showError(data.error);
                                    return;
                                }

                                // Generar campos para parámetros requeridos
                                data.required_params.forEach((param) => {
                                    const col = document.createElement("div");
                                    col.className = "col-md-6 mb-3";

                                    const label =
                                        document.createElement("label");
                                    label.className = "form-label";
                                    label.htmlFor = param;
                                    label.textContent =
                                        data.descriptions[param];

                                    const input =
                                        document.createElement("input");
                                    input.type = "number";
                                    input.className = "form-control";
                                    input.id = param;
                                    input.name = param;
                                    input.step = "0.001";
                                    input.required = true;

                                    col.appendChild(label);
                                    col.appendChild(input);
                                    requiredParamsDiv.appendChild(col);
                                });

                                // Generar campos para parámetros opcionales
                                data.optional_params.forEach((param) => {
                                    const col = document.createElement("div");
                                    col.className = "col-md-6 mb-3";

                                    const label =
                                        document.createElement("label");
                                    label.className = "form-label";
                                    label.htmlFor = param;
                                    label.textContent =
                                        data.optional_descriptions[param];

                                    const input =
                                        document.createElement("input");
                                    input.type = "number";
                                    input.className = "form-control";
                                    input.id = param;
                                    input.name = param;
                                    input.step = "0.001";

                                    col.appendChild(label);
                                    col.appendChild(input);
                                    optionalParamsDiv.appendChild(col);
                                });
                            })
                            .catch((error) => {
                                showError(
                                    "Error al cargar los parámetros: " +
                                        error.message
                                );
                            });
                    } else {
                        // Desactivar botón de cálculo si no hay modelo seleccionado
                        btnCalculate.disabled = true;
                    }
                });

                // Mostrar/ocultar parámetros opcionales
                btnShowOptional.addEventListener("click", function () {
                    const isVisible =
                        optionalParamsDiv.style.display !== "none";
                    optionalParamsDiv.style.display = isVisible
                        ? "none"
                        : "block";
                    this.textContent = isVisible
                        ? "Mostrar parámetros opcionales"
                        : "Ocultar parámetros opcionales";
                });

                // Enviar formulario para cálculos
                paramsForm.addEventListener("submit", function (e) {
                    e.preventDefault();

                    // Ocultar mensajes de error previos
                    errorContainer.style.display = "none";

                    // Mostrar loader
                    loader.style.display = "block";

                    // Crear objeto de datos con el modelo y parámetros
                    const formData = {
                        model: modelSelect.value,
                    };

                    // Añadir parámetros requeridos
                    document
                        .querySelectorAll("#required-params input")
                        .forEach((input) => {
                            formData[input.name] = input.value;
                        });

                    // Añadir parámetros opcionales (solo los que tienen valor)
                    document
                        .querySelectorAll("#optional-params input")
                        .forEach((input) => {
                            if (input.value) {
                                formData[input.name] = input.value;
                            }
                        });

                    console.log("Datos enviados:", formData); // Para depuración
                    // Enviar solicitud para cálculos
                    fetch("/calculate", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify(formData),
                    })
                        .then((response) => response.json())
                        .then((data) => {
                            // Ocultar loader
                            loader.style.display = "none";

                            if (data.error) {
                                showError(data.error);
                                return;
                            }

                            // Mostrar resultados
                            displayResults(data.results, data.descriptions);
                        })
                        .catch((error) => {
                            // Ocultar loader
                            loader.style.display = "none";
                            showError(
                                "Error al realizar los cálculos: " +
                                    error.message
                            );
                        });
                });

                // Función para mostrar errores
                function showError(message) {
                    errorMessageDiv.textContent = message;
                    errorContainer.style.display = "block";
                    resultsContainer.style.display = "none";
                }

                // Función para mostrar resultados
                function displayResults(results, descriptions) {
                    resultsDiv.innerHTML = "";

                    // Crear una tabla para los resultados
                    const table = document.createElement("table");
                    table.className = "table table-hover";

                    const thead = document.createElement("thead");
                    const headerRow = document.createElement("tr");

                    ["Parámetro", "Descripción", "Valor", ""].forEach(
                        (text) => {
                            const th = document.createElement("th");
                            th.textContent = text;
                            headerRow.appendChild(th);
                        }
                    );

                    thead.appendChild(headerRow);
                    table.appendChild(thead);

                    const tbody = document.createElement("tbody");

                    // Orden específico de los parámetros
                    const probabilityParams = Object.keys(results)
                        .filter((key) => /^P\d+$/.test(key) && key !== "P0")
                        .sort(
                            (a, b) =>
                                Number(a.slice(1)) - Number(b.slice(1))
                        );
                    const orderedParams = [
                        "ρ",
                        "P0",
                        ...probabilityParams,
                        "Pk",
                        "PE",
                        "PNE",
                        "Lq",
                        "L",
                        "Ln",
                        "Wq",
                        "W",
                        "Wn",
                    ];

                    // Función para crear el botón de copia
                    function createCopyButton(value) {
                        const button = document.createElement("button");
                        button.className = "btn btn-outline-secondary btn-sm";
                        button.innerHTML = '<i class="bi bi-clipboard"></i>';
                        button.title = "Copiar valor";
                        button.onclick = () => {
                            navigator.clipboard
                                .writeText(value)
                                .then(() => {
                                    button.innerHTML =
                                        '<i class="bi bi-clipboard-check"></i>';
                                    setTimeout(() => {
                                        button.innerHTML =
                                            '<i class="ph ph-clipboard"></i>';
                                    }, 2000);
                                })
                                .catch((err) =>
                                    console.error("Error al copiar:", err)
                                );
                        };
                        return button;
                    }

                    // Procesar resultados en orden
                    orderedParams
                        .concat(
                            Object.keys(results).filter(
                                (key) => !orderedParams.includes(key)
                            )
                        )
                        .forEach((param) => {
                            if (results.hasOwnProperty(param)) {
                                const row = document.createElement("tr");

                                const paramCell = document.createElement("td");
                                paramCell.textContent = param;
                                row.appendChild(paramCell);

                                const descCell = document.createElement("td");
                                descCell.textContent =
                                    descriptions[param] || "";
                                row.appendChild(descCell);

                                const valueCell = document.createElement("td");
                                valueCell.className = "result-value";
                                valueCell.textContent = results[param];
                                row.appendChild(valueCell);

                                const buttonCell = document.createElement("td");
                                buttonCell.appendChild(
                                    createCopyButton(results[param])
                                );
                                row.appendChild(buttonCell);

                                tbody.appendChild(row);
                            }
                        });

                    table.appendChild(tbody);
                    resultsDiv.appendChild(table);
                    resultsContainer.style.display = "block";
                }

                // Inicializa Fancybox cuando el modal de fórmulas se abre.
                // Es importante que jQuery y Fancybox estén cargados.
                $("#formulasModal").on("shown.bs.modal", function () {
                    // Selecciona el enlace que envuelve la imagen y lo inicializa con Fancybox
                    $("#fancybox-link").fancybox({
                        // Opciones de Fancybox (puedes ajustar a tu gusto)
                        infobar: false, // Oculta la barra de información en la parte superior
                        buttons: [
                            // Botones a mostrar
                            "zoom",
                            "close",
                        ],
                        transitionEffect: "fade", // Efecto de transición al abrir/cerrar
                        loop: false, // No permitir ciclar si hay una sola imagen
                        image: {
                            preload: true, // Precarga la imagen para una mejor experiencia
                        },
                    });
                });
            });
        </script>
    </body>
</html>
